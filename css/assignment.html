<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card</title>
    <link href="styles.css" rel="stylesheet" />
    <style>

.container {
    position: relative;
    width: 200px;
    height: 200px;
}

img {
    width: 100%;
    height: 100%;
    border-radius: 20px;
}

.badge{
    position: absolute;
    top: 5px;
    left: 10px;
    background-color: white;
    padding: 5px 10px;
    border-radius: 15px;
    font-size: 12px;
    font-weight: 600;
}

.heart{
    position: absolute;
    top: 10px;
    right: 10px;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 18px;
}
    </style>
</head>
<body>
    <div class="container">
        <img src="https://a0.muscache.com/im/pictures/hosting/Hosting-1528329411154836390/original/29f9ea5e-e0d9-4746-8b60-dee064efc528.jpeg?im_w=1200" alt="home in pune">
         <p class="badge">Guest favorite</p>
        <div class="heart">♡</div>
    </div>
</body>
</html>
